kind = "web"
previewPath = "/"
title = "MetricFlow — SaaS Dashboard"
version = "1.0.0"
id = "artifacts/metricflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24750

[services.development]
run = "pnpm --filter @workspace/metricflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/metricflow", "run", "build" ]
publicDir = "artifacts/metricflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24750"
BASE_PATH = "/"
